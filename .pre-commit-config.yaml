ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autofix_commit_msg: "style: pre-commit fixes"
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/adamchainz/blacken-docs
    rev: "dda8db18cfc68df532abf33b185ecd12d5b7b326" # frozen: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==23.*]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c" # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
        exclude: ^tests/packages/
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: "3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316" # frozen: v1.10.0
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "0ee178619d696787ca73d210cc191d720868c631" # frozen: v3.9.6
    hooks:
      - id: prettier
        types_or: [yaml, markdown, html, css, scss, javascript, json]
        args: [--prose-wrap=always]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "321478e58f4938179c6b86e4ddfa923d1547a49b" # frozen: v0.16.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "7ff8d35ae36a7d2b968f2f90b4c723e292e594ee" # frozen: v2.3.1
    hooks:
      - id: mypy
        files: src|tests
        exclude: ^tests/packages/
        args: []
        additional_dependencies:
          - pytest<9
          - scikit-build-core
          - importlib-resources

  - repo: https://github.com/codespell-project/codespell
    rev: "57b21406f092110c18776e39b0bda50d37c945c8" # frozen: v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: "a6564f5d57444e123433a5c9af733e3975c77229" # frozen: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: disallow-caps
        name: Disallow improper capitalization
        language: pygrep
        entry: PyBind|Numpy|Cmake|CCache|Github|PyTest
        exclude: .pre-commit-config.yaml
      - id: disallow-misspell
        name: Disallow misspelled words
        language: pygrep
        entry: "[Ll]angauge"
        exclude: .pre-commit-config.yaml

  - repo: https://github.com/henryiii/validate-pyproject-schema-store
    rev: "0cee1769d7b9f642b7545be04c079f94277d6833" # frozen: 2026.09.04
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: "c4654a7e007c9619a5eb63c39a456572a0fa1851" # frozen: 0.38.0
    hooks:
      - id: check-dependabot
      - id: check-github-workflows
      - id: check-readthedocs

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: "cef8b8350da46d8114c7e6b7272aebdccdf193ce" # frozen: v1.30.0
    hooks:
      - id: zizmor
        files: "^\\.github"
        args: [--persona=pedantic]

  - repo: https://github.com/scientific-python/cookie
    rev: "1589a99867d6cac494ac7545fe6a83108580a3ee" # frozen: 2026.08.14
    hooks:
      - id: sp-repo-review
